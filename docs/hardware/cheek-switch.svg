      .panel { fill: #fff; stroke: #d2dfdd; stroke-width: 2; }
      .heading { font-size: 32px; font-weight: 710; fill: #132c2b; }
      .label { font-size: 23px; font-weight: 650; fill: #263c40; }
      .note { font-size: 22px; fill: #4a5d64; }
      .small { font-size: 20px; fill: #4a5d64; }
      .pins { font-size: 17px; font-weight: 700; }
      .signal { fill: none; stroke: #1461b6; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .ground { fill: none; stroke: #3c4958; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .callout { fill: none; stroke: #72868a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
