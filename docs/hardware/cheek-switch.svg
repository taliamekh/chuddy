<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1470" viewBox="0 0 1160 1470" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Patrick’s right-cheek button</title>
  <desc id="diagram-desc">Raspberry Pi 5 top view with the header at the top, USB and Ethernet on the right, and pin 1 at the bottom-left of the header. A blue wire joins candidate GPIO17 on pin 11 to switch contact A. A charcoal wire joins ground on pin 9 to switch contact B. The normally open switch closes on a press. The two pairs of legs shown form an example layout to verify with a meter. The lower inset shows a guided pusher and a switch on a carrier fixed to the pelvis, plus slack and strain relief along the cable down into the stationary base.</desc>
