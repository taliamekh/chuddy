name: Prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.26,<3" "sounddevice==0.5.6"
      - name: Python behavior and local protocol checks
        run: python -m unittest discover -s tests -v
      - name: Browser integration and interface checks
        run: node --test tests/frontend.test.cjs tests/status-labels.test.cjs tests/character-geometry.cjs tests/chud-cursor.test.cjs

      # Tests use fake models/audio/outputs. They do not download ML models,
      # open microphones, play sound, intercept windows or arm physical devices.
